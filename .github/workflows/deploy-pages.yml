name: Deploy RFQFlow Pages
on:
  push:
    branches: [integration/rfq-to-quote]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/rfq-to-quote
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure non-secret backend URL
        env:
          RFQFLOW_API_URL: ${{ vars.RFQFLOW_API_URL }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.parse import urlparse
          value = os.environ.get('RFQFLOW_API_URL', '').rstrip('/')
          if value and urlparse(value).scheme != 'https':
              raise SystemExit('Production backend must use HTTPS')
          if value:
              Path('site/config.json').write_text(json.dumps({'apiBaseUrl': value}))
          PY
      - name: Validate static source
        run: |
          node --check site/app.js
          python scripts/check_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
